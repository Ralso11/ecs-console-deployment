<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="600" fill="#1b1b1b">ECS Console Deployment: architecture (eu-central-1)</text>

  <!-- Browser -->
  <rect x="30" y="215" width="130" height="70" rx="8" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="95" y="245" text-anchor="middle" font-size="14" font-weight="600" fill="#1b1b1b">Browser</text>
  <text x="95" y="265" text-anchor="middle" font-size="12" fill="#444">my IP</text>

  <!-- VPC -->
  <rect x="200" y="60" width="480" height="430" rx="10" fill="#fafafa" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="215" y="82" font-size="13" font-weight="600" fill="#555">Default VPC</text>

  <!-- Security group -->
  <rect x="225" y="190" width="150" height="120" rx="8" fill="#fff4e5" stroke="#d98b1f" stroke-width="1.5"/>
  <text x="300" y="228" text-anchor="middle" font-size="14" font-weight="600" fill="#1b1b1b">Security group</text>
  <text x="300" y="250" text-anchor="middle" font-size="12" fill="#444">inbound TCP 8080</text>
  <text x="300" y="270" text-anchor="middle" font-size="12" fill="#444">(firewall)</text>

  <!-- Subnet -->
  <rect x="410" y="110" width="250" height="330" rx="10" fill="#f1f8f1" stroke="#4d9a4d" stroke-width="1.5"/>
  <text x="425" y="132" font-size="13" font-weight="600" fill="#2f6b2f">Public subnet, zone eu-central-1a</text>

  <!-- Task -->
  <rect x="435" y="160" width="200" height="110" rx="8" fill="#ffffff" stroke="#2f6b2f" stroke-width="2"/>
  <text x="535" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#1b1b1b">Fargate task</text>
  <text x="535" y="212" text-anchor="middle" font-size="12" fill="#444">container: cryptoapp</text>
  <text x="535" y="232" text-anchor="middle" font-size="12" fill="#444">Flask on port 8080</text>
  <text x="535" y="252" text-anchor="middle" font-size="12" fill="#444">public IP enabled</text>

  <!-- Service / task def / cluster -->
  <rect x="435" y="310" width="200" height="60" rx="8" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="535" y="335" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1b1b">ECS service</text>
  <text x="535" y="355" text-anchor="middle" font-size="12" fill="#444">cryptoapp-service (desired 1)</text>

  <rect x="435" y="385" width="200" height="40" rx="8" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="535" y="410" text-anchor="middle" font-size="11" fill="#444">Task definition wise-server-26oklo:2</text>

  <!-- ECR -->
  <rect x="720" y="150" width="160" height="70" rx="8" fill="#f3ecf9" stroke="#7b4fa3" stroke-width="1.5"/>
  <text x="800" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#1b1b1b">Amazon ECR</text>
  <text x="800" y="198" text-anchor="middle" font-size="10" fill="#444">ecs-docker-project-app:latest</text>

  <!-- CloudWatch -->
  <rect x="720" y="260" width="160" height="60" rx="8" fill="#f3ecf9" stroke="#7b4fa3" stroke-width="1.5"/>
  <text x="800" y="287" text-anchor="middle" font-size="14" font-weight="600" fill="#1b1b1b">CloudWatch Logs</text>
  <text x="800" y="306" text-anchor="middle" font-size="11" fill="#444">container output</text>

  <!-- Cluster label -->
  <text x="450" y="505" text-anchor="middle" font-size="12" fill="#555">ECS cluster: ecs-docker-project-console (Fargate only)</text>

  <!-- Arrows -->
  <line x1="160" y1="250" x2="223" y2="250" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="192" y="240" text-anchor="middle" font-size="11" fill="#444">HTTP 8080</text>
  <line x1="375" y1="250" x2="433" y2="230" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="190" x2="637" y2="205" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="172" text-anchor="middle" font-size="11" fill="#444">image pull</text>
  <line x1="637" y1="250" x2="718" y2="285" stroke="#444" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="680" y="283" text-anchor="middle" font-size="11" fill="#444">logs</text>
  <line x1="535" y1="310" x2="535" y2="272" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="535" y1="385" x2="535" y2="372" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
